name: CKL - Deploy

on:
  workflow_dispatch:
    inputs:
      run-type:
        description: 'Run option'
        required: true
        default: 'Deploy-to-DEMO'
        type: choice
        options:
        - 'Deploy-to-DEMO'

permissions:
  contents: read
  id-token: write

jobs:
  tests:
    uses: ./.github/workflows/ci.yml # execute the callable ci.yml
    secrets: inherit # pass all secrets

  internal_sep_validation:
    uses: ./.github/workflows/internal_sep_validation.yml
    needs:
      - tests
    secrets: inherit

  e2e_integration_test:
    uses: ./.github/workflows/e2e_integration_test.yml # execute the callable e2e_integration_test.yml
    needs:
      - tests
    secrets: inherit # pass all secrets

  build:
    name: Build & push
    runs-on: ubuntu-latest
    needs:
      - tests
      - internal_sep_validation
      - e2e_integration_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Image tag (short SHA)
        id: tag
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2.1.5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push to ECR
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          file: Dockerfile
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.tag.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Slack on Deploy Success
        if: success() && vars.TERRAFORM_MESSAGE_SLACK == 'true'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: |
              `SDP API Deploy Success Report`
              *📌 Repository:* <https://github.com/${{ github.repository }}|${{ github.repository }}>
              *🔀 Branch:* ${{ github.ref_name }}
              *📃 Commit:* ${{ github.sha }}
              *👤 Author:* ${{ github.actor }}
              *🔗 Commit Link:* <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|View Commit>
              ${{ github.event.pull_request.title != '' && format('*📢 PR:* {0} (<https://github.com/{1}/pull/{2}|Open PR>)', github.event.pull_request.title, github.repository, github.event.pull_request.number) || '' }}
              *✅ Status:* Deploy to DEMO completed successfully.
            attachments:
              - color: "#36a64f"
                text: "Deploy completed"

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: ["build"]
    steps:
      - name: Notify Slack on Failure
        if: ${{ vars.TERRAFORM_MESSAGE_SLACK == 'true' }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: |
              `SDP API CD Failure Report`
              *📌 Repository:* <https://github.com/${{ github.repository }}|${{ github.repository }}>
              *🔀 Branch:* ${{ github.ref_name }}
              *📃 Commit:* ${{ github.sha }}
              *👤 Author:* ${{ github.actor }}
              *🔗 Commit Link:* <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|View Commit>
              ${{ github.event.pull_request.title != '' && format('*📢 PR:* {0} (<https://github.com/{1}/pull/{2}|Open PR>)', github.event.pull_request.title, github.repository, github.event.pull_request.number) || '' }}
              *⚠️ Status:* Deployment failed. Please review the workflow logs for details: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}>
            attachments:
              - color: "#ff0000"
                text: "Deployment failed"
